name: Test e2e/e2e-v1

on:
  push:
  pull_request:
    branches:
      - master
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby_version: ["2.7", "3.0", "3.1", "3.2", "3.3"]
        os: ["ubuntu-latest","windows-latest","macos-latest"]
        project: [e2e,e2e-pact-ruby-v1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set PACT_RUBY_V2_ENABLE env var
        run: |
          if [ "${{ matrix.project }}" = "e2e" ]; then
            echo "PACT_RUBY_V2_ENABLE=true" >> $GITHUB_ENV
            echo "PACT_RUBY_V1_ENABLE=false" >> $GITHUB_ENV
          else
            echo "PACT_RUBY_V2_ENABLE=false" >> $GITHUB_ENV
            echo "PACT_RUBY_V1_ENABLE=true" >> $GITHUB_ENV
          fi
        shell: bash

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
          working-directory: ${{ matrix.project }}
      # - run: "bundle install"
      #   working-directory: ${{ matrix.project }}
      - run: "bundle exec rake pact:spec"
        working-directory: ${{ matrix.project }}
      - run: "bundle exec rake pact:verify:foobar"
        working-directory: ${{ matrix.project }}
        if: matrix.os != 'windows-latest'
      # - run: "ruby.exe -S pact verify --pact-helper ./provider/spec/pact_helper.rb --pact-uri ./consumer/spec/pacts/foo-bar.json"
      #   working-directory: ${{ matrix.project }}
      #   if: matrix.os == 'windows-latest' && matrix.project == 'e2e-pact-ruby-v1'
